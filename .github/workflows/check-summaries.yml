name: Check summaries

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check daily and weekly summaries
        run: python tools/summary.py check all
