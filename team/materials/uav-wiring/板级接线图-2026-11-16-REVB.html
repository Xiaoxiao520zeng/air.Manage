  <!-- ============ 注释 ============ -->
  <text class="t1" x="40" y="935">01  电源架构与电压余量 ⚠ 重点</text>
  <text class="t2" x="40" y="956">PMU 2Lite 必须选 15V 版（X25 套装标配）：输出 15V/6A 经原装 8 针线束接 POWER C1，CAN1 经线束上报电池信息。</text>
  <text class="t2" x="40" y="974">⚠ 15V 版输入下限 20V：6S 满充 25.2V，大油门带载压降后可能瞬间低于 20V → PMU 断输出、飞控断电。</text>
  <text class="t2" x="40" y="992">首飞前台架实测满油门电池端电压须 ≥21V；做不到则改 8S 电池，并同步更换电调（Tekko32 F4 仅 4-6S）与 A6 输入规格。</text>
  <text class="t1" x="40" y="1024">02  主回路连接器与线径</text>
  <text class="t2" x="40" y="1045">电池↔PMU 用原装 QS8/7AWG（W01），禁止经 XT60（约 60A 上限）；BATT-OUT→J1 用 7AWG。</text>
  <text class="t2" x="40" y="1063">J1→电调 / BEC / A6 分路按实测电流选 12-14AWG。BEC12S-PRO 无反接保护，上电前核对极性。</text>
  <text class="t1" x="40" y="1095">03  BEC → Jetson</text>
  <text class="t2" x="40" y="1116">BEC 出厂默认 5.2V，OUT 焊桥必须改接 12V（输入 ≥14V 已满足）。J16 5.5×2.5mm 中心正、输入 9-19V，</text>
  <text class="t2" x="40" y="1134">禁止直接接入 6S。Jetson 15W 模式峰值电流 < 3.5A（J16 上限），BEC 5A 持续满足。</text>

  <text class="t1" x="880" y="935">04  Jetson ↔ 飞控</text>
  <text class="t2" x="880" y="956">TELEM2（3.3V）↔ J12-8/9/10（UART1）：TX/RX 交叉、GND 共地；两端同波特率（MAVLink2，57600/921600）。</text>
  <text class="t2" x="880" y="974">J12 复用 UART1 时关闭串口控制台与 RTS/CTS；TELEM2 的 +5V / CTS / RTS 引脚留空。</text>
  <text class="t1" x="880" y="1006">05  CAN 总线</text>
  <text class="t2" x="880" y="1027">CAN1 保留给 PMU（经 W02 线束）；CAN2 → 原配 CAN 扩展板（虚线接法仅适用 X25 原配板，另购型号先核对端口、</text>
  <text class="t2" x="880" y="1045">供电与终端）。CAN_H/L 用双绞线，总线物理两端各 120Ω。</text>
  <text class="t1" x="880" y="1077">06  动力与电机</text>
  <text class="t2" x="880" y="1098">M1–M4 统一 DShot300；转向 = ArduPilot QuadX：M1 右前 CCW、M2 左后 CCW、M3 左前 CW、M4 右后 CW（CCW 位装反桨）。</text>
  <text class="t2" x="880" y="1116">首飞拆桨做 Motor Test 复核顺序与转向；C1 1000µF/35V 焊在电调 BAT± 焊点处，注意极性。</text>
